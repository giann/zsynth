syntax = "proto3";

package zsynth;

message SynthDocument {
  uint32 schema_version = 1;
  uint32 output_node = 2;
  repeated Node nodes = 3;
}

message Node {
  string kind = 1;
  string name = 2;
  int32 x = 3;
  int32 y = 4;
  repeated Connection inputs = 5;

  oneof parameters {
    ConstantParameters constant = 10;
    OscillatorParameters oscillator = 11;
    MixerParameters mixer = 12;
    SequencerParameters sequencer = 13;
    AdsrParameters adsr = 14;
    FilterParameters filter = 15;
    BitCrusherParameters bit_crusher = 16;
    NoiseParameters noise = 17;
  }
}

message Connection {
  uint32 input_port = 1;
  uint32 source_node = 2;
  uint32 source_port = 3;
}

message ConstantParameters {
  optional float constant = 1;
}

message OscillatorParameters {
  optional string waveform = 1;
  optional float phase_offset = 2;
  optional float default_frequency = 3;
  optional float default_amplitude = 4;
}

message MixerParameters {
  optional float gain = 1;
  repeated float gains = 2;
  repeated float pans = 3;
}

message SequencerParameters {
  optional uint32 bpm = 1;
  repeated Note notes = 2;
  optional bool loop = 3;
}

message Note {
  optional uint32 pitch = 1;
  optional bool has_pitch = 2;
  optional uint64 start_tick = 3;
  optional uint64 duration_ticks = 4;
  optional float velocity = 5;
}

message AdsrParameters {
  optional float attack = 1;
  optional string attack_curve = 2;
  optional float decay = 3;
  optional string decay_curve = 4;
  optional float sustain = 5;
  optional float release = 6;
  optional string release_curve = 7;
}

message FilterParameters {
  optional string type = 1;
  optional float default_cutoff = 2;
  optional float default_resonance = 3;
}

message BitCrusherParameters {
  optional uint32 target_sample_rate = 1;
  optional uint32 bit_depth = 2;
}

message NoiseParameters {
  optional uint64 seed = 1;
  optional string type = 2;
  optional float amplitude = 3;
}
